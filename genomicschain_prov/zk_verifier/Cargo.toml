# gc_zk_verify — the one non-Ruby piece of genomicschain_prov (design v0.1.12
# §6.1, §7). RISC Zero receipts can only be verified by RISC Zero's own Rust
# verifier, so this crate exists; Cargo.lock sits beside it so the build is
# reproducible (memory skillsets-ruby-first: another language only where
# unavoidable, always lock-pinned). Verification only — no prover.
[package]
name = "gc_zk_verify"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
bincode = "=1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
